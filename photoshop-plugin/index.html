<!DOCTYPE html>
<html>
<head>
<style>
  /* CRT green theme carried over from the RetroPro editor, trimmed to the
     CSS subset UXP supports (no gradients-as-background tricks, no blend
     modes). */
  :root {
    --bg: #090d0b;
    --panel: #0f1512;
    --panel-2: #0b100e;
    --ink: #b8ffb3;
    --ink-dim: #7dd87a;
    --accent: #52ffa9;
    --warn: #ff846b;
    --border: #184628;
  }
  body {
    margin: 0;
    padding: 10px;
    background-color: var(--bg);
    color: var(--ink);
    font-family: monospace;
    font-size: 12px;
  }
  h1 {
    font-size: 14px;
    font-weight: normal;
    letter-spacing: 1px;
    color: var(--accent);
    margin: 0 0 10px 0;
  }
  .row { display: flex; align-items: center; margin-bottom: 8px; }
  .row > * { margin-right: 6px; }
  .grow { flex: 1 1 auto; }
  .chip {
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background-color: var(--panel-2);
    color: var(--ink-dim);
  }
  select, input, button {
    background-color: #0e1814;
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    font-family: monospace;
    font-size: 12px;
  }
  button { padding: 6px 10px; }
  button:disabled { opacity: 0.5; }
  #applyBtn {
    width: 100%;
    padding: 10px;
    color: var(--accent);
    border-color: var(--accent);
    font-size: 13px;
    letter-spacing: 1px;
  }
  .effect-block {
    border: 1px dashed #144429;
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 10px;
    background-color: var(--panel);
  }
  .effect-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .kv {
    display: flex;
    align-items: center;
    margin: 4px 0;
  }
  .kv label { flex: 0 0 72px; color: var(--ink-dim); }
  .kv input[type="range"] { flex: 1 1 auto; margin: 0 6px; }
  .kv select { flex: 1 1 auto; margin: 0 6px; }
  .val { min-width: 36px; text-align: right; color: var(--ink); }
  .divider { height: 1px; background-color: #103c23; margin: 10px 0; }
  .muted { color: var(--ink-dim); }
  #status {
    margin-top: 8px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background-color: var(--panel-2);
    color: var(--ink-dim);
    min-height: 16px;
  }
</style>
</head>
<body>
  <h1>RETROPRO FX</h1>

  <div class="row">
    <span class="chip">Layer</span>
    <select id="layerSelect" class="grow"></select>
    <button id="refreshLayers" title="Re-read the layer list">↻</button>
  </div>

  <div class="effect-block">
    <div class="effect-title">
      <strong>Dithering</strong>
      <label><input type="checkbox" id="fx-dither" checked /> Enable</label>
    </div>
    <div class="kv">
      <label>Algorithm</label>
      <select id="dither-algo">
        <option value="floyd">Floyd–Steinberg</option>
        <option value="ordered8">Ordered 8×8</option>
        <option value="atkinson">Atkinson</option>
        <option value="burkes">Burkes</option>
        <option value="stucki">Stucki</option>
        <option value="jjn">Jarvis–Judice–Ninke</option>
        <option value="sierra">Sierra Lite</option>
      </select>
    </div>
    <div class="kv">
      <label>Levels</label>
      <input type="range" id="dither-levels" min="2" max="16" step="1" value="4" />
      <span class="val" data-val-for="dither-levels"></span>
    </div>
    <div class="kv">
      <label>Strength</label>
      <input type="range" id="dither-strength" min="0" max="1" step="0.05" value="1" />
      <span class="val" data-val-for="dither-strength"></span>
    </div>
  </div>

  <div class="effect-block">
    <div class="effect-title">
      <strong>Halftone</strong>
      <label><input type="checkbox" id="fx-halftone" /> Enable</label>
    </div>
    <div class="kv">
      <label>Mode</label>
      <select id="halftone-mode">
        <option value="dot">Dot</option>
        <option value="line">Line</option>
        <option value="cell">Cell</option>
      </select>
    </div>
    <div class="kv">
      <label>Cell</label>
      <input type="range" id="halftone-cell" min="2" max="32" step="1" value="8" />
      <span class="val" data-val-for="halftone-cell"></span>
    </div>
    <div class="kv">
      <label>Angle</label>
      <input type="range" id="halftone-angle" min="0" max="90" step="1" value="15" />
      <span class="val" data-val-for="halftone-angle"></span>
    </div>
  </div>

  <div class="effect-block">
    <div class="effect-title">
      <strong>RGB Split</strong>
      <label><input type="checkbox" id="fx-rgb" /> Enable</label>
    </div>
    <div class="kv">
      <label>Shift X</label>
      <input type="range" id="rgb-dx" min="-20" max="20" step="1" value="3" />
      <span class="val" data-val-for="rgb-dx"></span>
    </div>
    <div class="kv">
      <label>Shift Y</label>
      <input type="range" id="rgb-dy" min="-20" max="20" step="1" value="-2" />
      <span class="val" data-val-for="rgb-dy"></span>
    </div>
    <div class="kv">
      <label>Blend</label>
      <input type="range" id="rgb-blend" min="0" max="1" step="0.05" value="0.7" />
      <span class="val" data-val-for="rgb-blend"></span>
    </div>
  </div>

  <div class="effect-block">
    <div class="effect-title">
      <strong>Noise</strong>
      <label><input type="checkbox" id="fx-noise" /> Enable</label>
    </div>
    <div class="kv">
      <label>Type</label>
      <select id="noise-type">
        <option value="uniform">Uniform</option>
        <option value="gaussian">Gaussian</option>
      </select>
    </div>
    <div class="kv">
      <label>Amount</label>
      <input type="range" id="noise-amount" min="0" max="1" step="0.05" value="0.2" />
      <span class="val" data-val-for="noise-amount"></span>
    </div>
    <div class="kv">
      <label>Mono</label>
      <input type="checkbox" id="noise-mono" />
    </div>
  </div>

  <div class="effect-block">
    <div class="effect-title">
      <strong>Xerox</strong>
      <label><input type="checkbox" id="fx-xerox" /> Enable</label>
    </div>
    <div class="kv">
      <label>Threshold</label>
      <input type="range" id="xerox-thresh" min="0" max="1" step="0.05" value="0.55" />
      <span class="val" data-val-for="xerox-thresh"></span>
    </div>
    <div class="kv">
      <label>Edge</label>
      <input type="range" id="xerox-edge" min="0" max="3" step="0.1" value="1.2" />
      <span class="val" data-val-for="xerox-edge"></span>
    </div>
    <div class="kv">
      <label>Paper</label>
      <input type="text" id="xerox-paper" value="#f0efe7" />
    </div>
  </div>

  <div class="effect-block">
    <div class="effect-title">
      <strong>CRT</strong>
      <label><input type="checkbox" id="fx-crt" /> Enable</label>
    </div>
    <div class="kv">
      <label>Scanlines</label>
      <input type="range" id="crt-scan" min="0" max="1" step="0.05" value="0.35" />
      <span class="val" data-val-for="crt-scan"></span>
    </div>
    <div class="kv">
      <label>Vignette</label>
      <input type="range" id="crt-vignette" min="0" max="1" step="0.05" value="0.3" />
      <span class="val" data-val-for="crt-vignette"></span>
    </div>
    <div class="kv">
      <label>Mask</label>
      <input type="range" id="crt-mask" min="0" max="1" step="0.05" value="0.25" />
      <span class="val" data-val-for="crt-mask"></span>
    </div>
    <div class="kv">
      <label>Curved</label>
      <input type="checkbox" id="crt-curved" />
    </div>
  </div>

  <div class="divider"></div>

  <div class="effect-block">
    <div class="effect-title">
      <strong>Adjustments</strong>
      <span class="muted">applied after effects</span>
    </div>
    <div class="kv">
      <label><input type="checkbox" id="adj-brightness" /> Bright</label>
      <input type="range" id="brightness-amount" min="-100" max="100" step="1" value="0" />
      <span class="val" data-val-for="brightness-amount"></span>
    </div>
    <div class="kv">
      <label><input type="checkbox" id="adj-contrast" /> Contrast</label>
      <input type="range" id="contrast-amount" min="-100" max="100" step="1" value="0" />
      <span class="val" data-val-for="contrast-amount"></span>
    </div>
    <div class="kv">
      <label><input type="checkbox" id="adj-saturation" /> Saturate</label>
      <input type="range" id="saturation-amount" min="-100" max="100" step="1" value="0" />
      <span class="val" data-val-for="saturation-amount"></span>
    </div>
    <div class="kv">
      <label><input type="checkbox" id="adj-hue" /> Hue</label>
      <input type="range" id="hue-amount" min="-180" max="180" step="1" value="0" />
      <span class="val" data-val-for="hue-amount"></span>
    </div>
  </div>

  <button id="applyBtn">APPLY TO LAYER</button>
  <div id="status">Loading…</div>

  <script src="js/effects.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
